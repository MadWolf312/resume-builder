<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Конструктор резюме</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>✨ Конструктор резюме</h1>

<div class="container">
  <div class="form">
    <input id="name" placeholder="Имя">
    <input id="email" placeholder="Email">

    <textarea id="skills" placeholder="Навыки"></textarea>
    <textarea id="experience" placeholder="Опыт"></textarea>

    <!-- 📸 Фото -->
    <label class="upload">
      📸 Загрузить фото
      <input type="file" id="photo" accept="image/*">
    </label>

    <button onclick="generateResume()">Создать</button>
    <button onclick="downloadPDF()">Скачать PDF</button>
  </div>

  <div class="preview" id="resume">
    <div class="header">
      <img id="r-photo" src="" alt="">
      <div>
        <h2 id="r-name"></h2>
        <p id="r-email"></p>
      </div>
    </div>

    <div class="section">
      <h3>Навыки</h3>
      <p id="r-skills"></p>
    </div>

    <div class="section">
      <h3>Опыт</h3>
      <p id="r-exp"></p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
